    <section class="task">
        <h2>Task 8 - Basic Animation</h2>
        <div class="animationArea">
            <div id="basicBox" class="box"></div>
        </div>
        <button id="basicAnimateBtn">Animate</button>
        <button id="basicResetBtn">Reset</button>
    </section>

    <section class="task">
        <h2>Task 9 - Sequential Animations</h2>
        <div class="animationArea">
            <div id="sequenceBox" class="box"></div>
        </div>
        <button id="sequenceBtn">Start Sequence</button>
        <button id="sequenceResetBtn">Reset</button>
    </section>

    <section class="task">
        <h2>Task 10 - Combined Animation</h2>
        <div class="animationArea">
            <div id="combinedBox" class="box"></div>
        </div>
        <button id="combinedBtn">Combined Animation</button>
        <button id="combinedResetBtn">Reset</button>
    </section>
