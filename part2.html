
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part 2 - jQuery Effects</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Part 2 - jQuery Effects</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="part1.html">Part 1</a>
        <a href="part2.html">Part 2</a>
        <a href="part3.html">Part 3</a>
        <a href="part4.html">Part 4</a>
        <a href="part5.html">Part 5</a>

    <section class="task">
        <h2>Task 2 - Visibility Methods</h2>
        <p id="visibilityText">You can hide and show this paragraph!</p>

        <button id="hideBtn">Hide</button>
        <button id="showBtn">Show</button>
        <button id="toggleBtn">Toggle</button>
    </section>

    <section class="task">
        <h2>Task 3 - Fade Methods</h2>

        <img id="fadeImage"
             src="https://picsum.photos/id/237/300/200"
             alt="Dog for fade effect">

        <div>
            <button id="fadeOutBtn">Fade Out</button>
            <button id="fadeInBtn">Fade In</button>
            <button id="fadeToggleBtn">Fade Toggle</button>
        </div>
    </section>

    <section class="task">
        <h2>Task 4 - Slide Methods</h2>

        <button id="slideUpBtn">Slide Up</button>
        <button id="slideDownBtn">Slide Down</button>
        <button id="slideToggleBtn">Slide Toggle</button>

        <div id="slidePanel">
            <h3>Collapsible Panel</h3>
            <p>This panel can slide up and down!</p>
        </div>
    </section>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
